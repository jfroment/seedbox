# yaml-language-server: $schema=./config.schema.json
# Seedbox configuration. Full documentation: doc/configuration.md
#
# Every service has default values (Traefik rules, dependencies) in its own directory: see
# services/<name>/service.yaml. Do not edit these files: here, you only write what you want to change.
#
#   <name>:                         # name of the service = name of its directory in services/
#     enabled: false                # do not run this service (default: true as soon as the service is listed here)
#     vpn: true                     # route the service through the VPN client, gluetun (default: false)
#     customFile: other.yaml        # docker-compose file to use in the directory of the service (default: compose.yaml)
#     traefik: false                # do not expose the service through Traefik (default: true if it has rules)
#     rules:                        # override the default Traefik rules: the first one overrides the first
#       - host: tv.${TRAEFIK_DOMAIN}  # default rule and so on, only for the parameters you write. More rules = added
#         httpAuth: false           # enable/disable http authentication
#         internalOnly: true        # only reachable from your local networks
#         mtls: true                # only reachable with a client certificate (see doc/apps/vaultls.md)
#         httpOnly: true            # plain http only, no certificate (see doc/configuration.md#disable-https-completely)
#         internalPort: 8989        # port of the service in its container
#         internalScheme: https     # http by default
#
# Uncomment to change a parameter for the rules of all services at once (still overridable for each service):
# defaults:
#   internalOnly: true

services:
  traefik:
  deluge:
  flood:
  qbittorrent:
    enabled: false
  plex:
    # Uncomment to use the alternative file of the plex directory, with specific parameters for hardware transcoding
    # customFile: compose-hardware-transcoding.yaml
  jellyfin:
    enabled: false
  flaresolverr:
  jackett:
  prowlarr:
  sonarr:
  radarr:
  bazarr:
  lidarr:
    enabled: false
  calibre:
    enabled: false
  calibre-web:
    enabled: false
  komga:
    enabled: false
  kavita:
    enabled: false
  mylar:
  seerr:
  tautulli:
  ntfy:
    enabled: false
  jdownloader:
  tdarr:
  # Database required by Nextcloud
  mariadb:
  nextcloud:
  # FileBrowser Quantum: see doc/apps/filebrowser.md
  filebrowser:
    enabled: false
  paperless:
    enabled: false
  actual:
    enabled: false
  mealie:
    enabled: false
  stirlingpdf:
    enabled: false
  bentopdf:
    enabled: false
  vaultwarden:
    enabled: false
  # Certificate Authority to create client certificates (mTLS): see doc/apps/vaultls.md
  vaultls:
    enabled: false
  # Needs access to the Docker socket: see doc/apps/dockhand.md
  dockhand:
    enabled: false
  netdata:
  duplicati:
    enabled: false
  syncthing:
    enabled: false
  # Beware: its default host is your domain itself (${TRAEFIK_DOMAIN})
  heimdall:
    enabled: false
  homepage:
    enabled: false
  wireguard:
    enabled: false
  # Needs several setup steps: see doc/apps/netbird.md
  netbird:
    enabled: false
  # Gluetun is the VPN client service: enable it if at least one service has "vpn: true"
  gluetun:
    enabled: false

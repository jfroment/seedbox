services:
  vaultls:
    image: ghcr.io/7ritn/vaultls:latest
    container_name: vaultls
    restart: unless-stopped
    environment:
      - VAULTLS_URL=https://vaultls.${TRAEFIK_DOMAIN}/
    volumes:
      - configvaultls:/app/data

volumes:
  configvaultls:
    driver: local-persist
    driver_opts:
      mountpoint: $HOST_CONFIG_PATH/vaultls

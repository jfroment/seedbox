services:
  homepage:
    image: filebrowser/filebrowser:s6
    container_name: filebrowser
    restart: unless-stopped
    volumes:
      - ${HOST_CONFIG_PATH}/filebrowser/config:/config
      - ${HOST_CONFIG_PATH}/filebrowser/db:/database
      - torrents:/srv
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8234/health"]
      interval: 30s
      timeout: 20s
      retries: 3

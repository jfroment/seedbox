services:
  homepage:
    image: ghcr.io/gethomepage/homepage
    container_name: homepage
    restart: unless-stopped
    volumes:
      - ${HOST_CONFIG_PATH}/homepage:/app/config
      - /var/run/docker.sock:/var/run/docker.sock
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}

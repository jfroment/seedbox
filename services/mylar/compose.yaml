services:
  mylar:
    image: lscr.io/linuxserver/mylar3:latest
    container_name: mylar3
    restart: unless-stopped
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
    volumes:
      - ${HOST_CONFIG_PATH}/mylar:/config
      - torrents:/comics
      - downloads:/downloads

services:
  # See tools/init-setup-nextcloud.sh for first install
  nextcloud:
    depends_on:
      - mariadb
    image: linuxserver/nextcloud
    container_name: nextcloud
    restart: unless-stopped
    environment:
      - PGID=${PGID}
      - PUID=${PUID}
      - TZ=${TZ}
    volumes:
      - ${HOST_CONFIG_PATH}/nextcloud:/config
      - ${HOST_CONFIG_PATH}/nextcloud-data:/data
      - torrents:/torrents

services:
  kavita:
    image: lscr.io/linuxserver/kavita:latest
    container_name: kavita
    restart: unless-stopped
    volumes:
      - ${HOST_CONFIG_PATH}/kavita:/config
      - torrents:/torrents
      - /etc/localtime:/etc/localtime:ro
    environment:
      - TZ=${TZ}
      - PGID=${PGID}
      - PUID=${PUID}
